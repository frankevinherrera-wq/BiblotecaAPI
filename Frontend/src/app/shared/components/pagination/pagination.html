<div class="bar">
  <span>{{ total() }} registro(s)</span>
  <div class="controls">
    <button type="button" (click)="pageChange.emit(page() - 1)" [disabled]="page() <= 1">&lsaquo; Anterior</button>
    <span class="page">{{ page() }} / {{ totalPages() }}</span>
    <button type="button" (click)="pageChange.emit(page() + 1)" [disabled]="page() >= totalPages()">Siguiente &rsaquo;</button>
  </div>
</div>
