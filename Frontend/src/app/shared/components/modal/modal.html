<div class="backdrop" (click)="closed.emit()" role="presentation">
  <div class="dialog" role="dialog" aria-modal="true" [attr.aria-label]="title()" (click)="$event.stopPropagation()">
    <header>
      <h2>{{ title() }}</h2>
      <button type="button" class="x" (click)="closed.emit()" aria-label="Cerrar">&times;</button>
    </header>
    <div class="body"><ng-content /></div>
  </div>
</div>
