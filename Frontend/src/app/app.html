<nav class="navbar bg-animated cyber-grid">
  <div class="nav-inner">
    <a class="logo neon-text glitch-effect" data-text="CYBERLINK" routerLink="/dashboard">BIBLIOTECA CYBERLINK</a>

    <button type="button" class="menu-icon" [class.open]="menuOpen()" (click)="toggleMenu()"
      aria-label="Abrir menú" [attr.aria-expanded]="menuOpen()">
      <span class="hamburger"></span>
    </button>

    <ul class="menu" [class.open]="menuOpen()">
      @for (l of links; track l.path) {
        <li>
          <a class="nav-link" [attr.data-text]="l.label" [routerLink]="l.path"
            routerLinkActive="active" (click)="closeMenu()">{{ l.label }}</a>
        </li>
      }
    </ul>
  </div>
</nav>

<main class="content">
  <router-outlet />
</main>

<app-toast />
<app-confirm-dialog />
